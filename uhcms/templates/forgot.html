{% extends "base.html" %}{% block title %}Forgot password – Campus Helpdesk{% endblock %}{% block body %}
<section class="wrap sec"><div class="card formcard"><h1>Reset your password</h1><p class="muted">Enter your university email and we will send reset instructions.</p>
<form method="post"><label for="email">University email</label><input id="email" name="email" type="email" placeholder="you@uni.edu" required><button class="btn big full">Send instructions</button></form>
<p class="center"><a href="{{ url_for('login') }}">Back to log in</a></p></div></section>
{% endblock %}
